<!DOCTYPE html>

<head>

    <title>地方美食-Travel Food</title>
    <link rel="stylesheet" href="./css/myall.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .wrapper {
            width: 1024px;
            margin: 50px auto 0 auto;
            padding: 10px;
            box-shadow: 2px 2px 5px #888888;
            overflow: hidden;
        }

        .demo {
            width: 32%;
            margin-top: 10px;
            float: left;
            margin-right: 1%;
            box-shadow: 2px 2px 5px #888888;
        }

        .demo .logo {
            width: 100%;
            height: 200px;
            background-position: center center;
            background-size: cover;
            background-image: url(./image/cat1.avif);
        }
        @media (max-width: 1024px) {
            .wrapper {
                width: 100%;
                height: auto;
                margin: 20px auto;
                padding: 10px;
            }

            .demo {
                width: 100%;
                margin-top: 10px;
                float: none;
                margin-right: 0;
                box-shadow: 2px 2px 5px #888888;
            }

            .demo .logo {
                height: 150px;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper" id="foodlist">
        <div class="demo">
            <div class="logo bg-img" style="background-image: url(./image/cat1.avif);"></div>
